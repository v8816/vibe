<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCamp — Курс Python в одном файле</title>
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-panel: #252526;
            --text-main: #cccccc;
            --text-muted: #9cdcfe;
            --accent: #007acc;
            --success: #4ec9b0;
            --border: #333333;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            text-align: center;
            color: var(--accent);
            font-size: 1.2rem;
            margin: 0 0 20px 0;
            padding: 0 15px;
        }
        .module {
            margin-bottom: 15px;
        }
        .module-title {
            background-color: #333;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-left: 4px solid transparent;
        }
        .module-title.active {
            background-color: var(--accent);
            color: #000;
            border-left: 4px solid #666;
        }
        .lesson {
            padding: 8px 15px 8px 35px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lesson:hover { background-color: #333; }
        .lesson.done { color: var(--success); }
        .lesson.active { 
            background-color: #2d2d2d;
            color: white;
            font-weight: 600;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .lesson-header h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
        .progress-indicator { font-size: 0.85rem; color: var(--text-muted); }
        .content-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            background-color: #333;
            padding: 10px 15px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .panel-body {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
        }
        #theory-text { 
            line-height: 1.6;
            color: var(--text-muted);
        }
        #theory-text code { 
            background-color: #111; 
            color: #ce9178; 
            padding: 2px 4px; 
            border-radius: 3px; 
            font-family: Consolas, monospace;
        }
        #code-editor {
            width: 100%;
            height: 100%;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.95rem;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            resize: none;
            padding: 10px;
        }
        #code-editor:focus { outline: none; }
        .controls {
            padding-top: 15px;
            border-top: 1px solid var(--border);
            text-align: right;
        }
        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #005a9e; }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        #output { 
            background-color: #000; 
            color: #4ec9b0; 
            padding: 15px; 
            border-radius: 5px; 
            font-family: 'Courier New', monospace; 
            height: 200px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 10px;
        }
        #output.error { color: #f48771; }
        .hidden { display: none; }

        @media (max-width: 900px) {
            .content-area { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <h2>🐍 PyCamp</h2>
    <div id="modules-container"></div>
</div>

<div class="main-content">
    <div class="lesson-header">
        <h1 id="lesson-title">Выберите урок</h1>
        <div class="progress-indicator" id="progress-indicator"></div>
    </div>
    
    <div class="content-area">
        <div class="panel">
            <div class="panel-header">Теория</div>
            <div class="panel-body">
                <div id="theory-text">Теория выбранного урока появится здесь.</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">Редактор кода</div>
            <div class="panel-body" style="position: relative;">
                <textarea id="code-editor"># Пиши код здесь
print("Привет, PyCamp!")</textarea>
                <div id="output"></div>
            </div>
            <div class="controls">
                <button id="run-btn">▶️ Выполнить</button>
                <button id="check-btn" disabled>✅ Проверить</button>
            </div>
        </div>
    </div>
</div>

<script>
// === БАЗА ДАННЫХ КУРСА ===
const courseData = [
    {
        id: 'module-1', title: '1. Основы и синтаксис', lessons: [
            { id: '1-1', title: 'Первая программа', theory: 'Python — интерпретируемый язык. Команда <code>print()</code> выводит текст в консоль.' },
            { id: '1-2', title: 'Переменные и типы', theory: 'Переменные создаются при присваивании. Основные типы: <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>.' },
            { id: '1-3', title: 'Ввод данных', theory: 'Для получения данных от пользователя используется функция <code>input()</code>. Она всегда возвращает строку.' }
        ]
    },
    {
        id: 'module-2', title: '2. Логика и циклы', lessons: [
            { id: '2-1', title: 'Условный оператор if', theory: 'Конструкция <code>if...elif...else</code> позволяет выполнять код в зависимости от условий.' },
            { id: '2-2', title: 'Операторы сравнения', theory: 'Используйте <code>==</code>, <code>!=</code>, <code>></code>, <code><</code> для сравнения значений.' },
            { id: '2-3', title: 'Цикл for', theory: 'Цикл <code>for</code> используется для перебора элементов (например, в функции <code>range()</code>).' },
            { id: '2-4', title: 'Цикл while', theory: 'Цикл <code>while</code> выполняется, пока условие истинно. Не забывайте изменять счетчик, чтобы избежать бесконечного цикла.' }
        ]
    },
    {
        id: 'module-3', title: '3. Структуры данных', lessons: [
            { id: '3-1', title: 'Списки (Lists)', theory: 'Списки — изменяемые коллекции. Создаются в <code>[]</code>. Имеют методы <code>append()</code>, <code>pop()</code>.' },
            { id: '3-2', title: 'Словари (Dictionaries)', theory: 'Словари хранят пары ключ-значение. Создаются в <code>{}</code>. Доступ по ключу: <code>dict["key"]</code>.' },
            { id: '3-3', title: 'Кортежи и множества', theory: 'Кортежи (<code>()</code>) — неизменяемы. Множества (<code>set()</code>) — хранят только уникальные значения.' }
        ]
    },
    {
        id: 'module-4', title: '4. Функции', lessons: [
            { id: '4-1', title: 'Создание функций', theory: 'Функция объявляется через <code>def имя(аргументы):</code>. Используйте <code>return</code> для возврата значения.' },
            { id: '4-2', title: 'Аргументы и область видимости', theory: 'Аргументы могут быть позиционными и именованными. Переменные внутри функции локальны.' }
        ]
    },
    {
        id: 'module-5', title: '5. Продвинутые темы', lessons: [
            { id: '5-1', title: 'Обработка исключений', theory: 'Для защиты от ошибок используется <code>try...except</code>. Например, при делении на ноль.' },
            { id: '5-2', title: 'Работа с файлами', theory: 'Файлы открываются через <code>open()</code>. Используйте контекстный менеджер <code>with</code> для автоматического закрытия.' },
            { id: '5-3', title: 'ООП: Классы', theory: 'Класс — чертеж объекта. Создается через <code>class Имя:</code>. Метод <code>__init__</code> — конструктор.' }
        ]
    }
];

// === СОСТОЯНИЕ ПРИЛОЖЕНИЯ ===
let state = {
    currentModule: null,
    currentLesson: null,
    progress: {} // { "1-1": true, "1-2": false }
};

// === ОТОБРАЖЕНИЕ ИНТЕРФЕЙСА ===
function renderSidebar() {
    const container = document.getElementById('modules-container');
    container.innerHTML = '';
    courseData.forEach(module => {
        const moduleDiv = document.createElement('div');
        moduleDiv.className = 'module';
        
        const titleBtn = document.createElement('div');
        titleBtn.className = 'module-title';
        titleBtn.textContent = module.title;
        titleBtn.onclick = () => toggleModule(module.id);
        
        const lessonsDiv = document.createElement('div');
        lessonsDiv.className = 'lessons';
        
        module.lessons.forEach(lesson => {
            const lessonEl = document.createElement('div');
            lessonEl.className = 'lesson';
            lessonEl.id = `nav-${lesson.id}`;
            lessonEl.textContent = lesson.title;
            lessonEl.onclick = () => loadLesson(module.id, lesson.id);
            
            if (state.progress[lesson.id]) lessonEl.classList.add('done');
            lessonsDiv.appendChild(lessonEl);
        });
        
        moduleDiv.appendChild(titleBtn);
        moduleDiv.appendChild(lessonsDiv);
        container.appendChild(moduleDiv);
    });
}

function toggleModule(id) {
    const lessons = document.querySelectorAll(`#nav-${id} ~ .lessons .lesson`);
    const isHidden = lessons[0].classList.contains('hidden');
    lessons.forEach(l => l.classList.toggle('hidden', !isHidden));
}

function loadLesson(moduleId, lessonId) {
    const module = courseData.find(m => m.id === moduleId);
    const lesson = module.lessons.find(l => l.id === lessonId);
    
    state.currentModule = moduleId;
    state.currentLesson = lessonId;
    
    // Обновление сайдбара
    document.querySelectorAll('.lesson').forEach(el => el.classList.remove('active'));
    document.getElementById(`nav-${lessonId}`).classList.add('active');
    
    // Обновление контента
    document.getElementById('lesson-title').textContent = lesson.title;
    document.getElementById('theory-text').innerHTML = lesson.theory;
    document.getElementById('code-editor').value = getStarterCode(lessonId);
    document.getElementById('output').className = '';
    document.getElementById('output').textContent = '';
    document.getElementById('check-btn').disabled = true;
    
    saveState();
    renderProgress();
}

function getStarterCode(lessonId) {
    const codes = {
        '1-1': 'print("Привет, PyCamp!")',
        '1-2': 'name = "Студент"\nage = 25\nprint(f"Пользователю {name} лет: {age}")',
        '1-3': 'name = input("Введите ваше имя: ")\nprint(f"Привет, {name}!")',
        '2-1': 'age = int(input("Введите возраст: "))\nif age >= 18:\n    print("Доступ разрешен")\nelse:\n    print("Доступ запрещен")',
        '2-2': 'a = 10\nb = 20\nprint(a > b)',
        '2-3': 'for i in range(5):\n    print(f"Итерация {i}")',
        '2-4': 'count = 0\nwhile count < 3:\n    print(f"Счетчик: {count}")\n    count += 1',
        '3-1': 'items = ["яблоко", "банан"]\nitems.append("вишня")\nprint(items)',
        '3-2': 'user = {"name": "Иван", "age": 30}\nprint(user["name"])',
        '4-1': 'def greet(name):\n    return f"Привет, {name}!"\n\nprint(greet("Мир"))',
        '5-1': 'try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    print("На ноль делить нельзя!")',
        '5-2': '# with open("test.txt", "w") as f:\n#     f.write("Привет")\nprint("Файл записан")',
        '5-3': 'class Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        return f"{self.name} говорит: Гав!"\n\ndog = Dog("Бобик")\nprint(dog.bark())'
    };
    return codes[lessonId] || '# Пиши код здесь';
}

// === ЛОГИКА ПРОВЕРКИ ===
function runCode() {
    const code = document.getElementById('code-editor').value;
    const output = document.getElementById('output');
    output.className = '';
    output.textContent = '';
    
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    
    const iframeWindow = iframe.contentWindow;
    const oldConsole = iframeWindow.console;
    
    iframeWindow.console = {
        log: (...args) => {
            const text = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            output.textContent += text + '\n';
            oldConsole.log(...args);
        },
        error: (...args) => {
            const text = args.map(a => String(a)).join(' ');
            output.className = 'error';
            output.textContent += 'Ошибка: ' + text + '\n';
            oldConsole.error(...args);
        }
    };
    
    try {
        const script = document.createElement('script');
        script.text = code;
        iframeWindow.document.body.appendChild(script);
    } catch (e) {
        output.className = 'error';
        output.textContent = 'Ошибка выполнения: ' + e.message;
    } finally {
        document.body.removeChild(iframe);
    }
}

function checkCode() {
    const code = document.getElementById('code-editor').value;
    const lessonId = state.currentLesson;
    const output = document.getElementById('output');
    
    let success = false;
    const checks = {
        '1-1': code.includes('print('),
        '1-2': code.includes('name =') && code.includes('age ='),
        '1-3': code.includes('input('),
        '2-1': code.includes('if') && code.includes('else'),
        '2-2': code.includes('>') || code.includes('<'),
        '2-3': code.includes('for') && code.includes('range'),
        '2-4': code.includes('while'),
        '3-1': code.includes('[') && code.includes('append'),
        '3-2': code.includes('{') && code.includes('user['),
        '4-1': code.includes('def ') && code.includes('return'),
        '5-1': code.includes('try:') && code.includes('except'),
        '5-2': code.includes('open('),
        '5-3': code.includes('class ') && code.includes('__init__')
    };
    
    if (checks[lessonId]) {
        success = true;
        state.progress[lessonId] = true;
        output.className = '';
        output.textContent = '✅ Задание выполнено! Вы можете переходить к следующему уроку.';
        document.getElementById(`nav-${lessonId}`).classList.add('done');
    } else {
        output.className = 'error';
        output.textContent = '❌ Код написан верно, но не решает задачу урока. Попробуйте еще раз.';
    }
    
    saveState();
    renderProgress();
    renderSidebar();
}

// === УПРАВЛЕНИЕ СОСТОЯНИЕМ ===
function saveState() {
    localStorage.setItem('pystate', JSON.stringify(state));
}

function loadState() {
    const saved = localStorage.getItem('pystate');
    if (saved) {
        state = JSON.parse(saved);
    } else {
        // Инициализация прогресса
        courseData.forEach(m => m.lessons.forEach(l => state.progress[l.id] = false));
    }
}

function renderProgress() {
    const total = Object.keys(state.progress).length;
    const done = Object.values(state.progress).filter(v => v).length;
    document.getElementById('progress-indicator').textContent = `Прогресс: ${done}/${total}`;
}

// === ИНИЦИАЛИЗАЦИЯ ===
loadState();
renderSidebar();
renderProgress();

// Обработчики событий
document.getElementById('run-btn').addEventListener('click', runCode);
document.getElementById('check-btn').addEventListener('click', checkCode);
document.getElementById('code-editor').addEventListener('input', () => {
    document.getElementById('check-btn').disabled = false;
});

// Автофокус на редактор
document.getElementById('code-editor').focus();
</script>

</body>
</html>
