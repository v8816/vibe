<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#121821;
    --panel-2:#0f151d;
    --border:#232c38;
    --text:#dfe7ef;
    --muted:#8b98a8;
    --accent:#4ade80;
    --accent-dim:#166534;
    --blue:#60a5fa;
    --red:#f87171;
    --yellow:#fbbf24;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.6;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    height:56px;
    display:flex;
    align-items:center;
    gap:16px;
    padding:0 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:relative;
    z-index:50;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:.3px;}
  .logo{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,#4ade80,#22c55e 40%,#3b82f6);
    color:#04140a;font-weight:900;font-size:14px;
  }
  .progress-wrap{flex:1;display:flex;align-items:center;gap:12px;max-width:520px;margin-left:8px;}
  .progress-bar{
    flex:1;height:8px;border-radius:99px;background:#1b2431;overflow:hidden;border:1px solid var(--border);
  }
  #progressFill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .35s ease;}
  #progressText{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .status{
    font-size:12.5px;color:var(--muted);padding:4px 10px;border:1px solid var(--border);
    border-radius:99px;white-space:nowrap;
  }
  .status.ready{color:var(--accent);border-color:#1d4d33;background:#0c1f16;}
  .status.err{color:var(--red);border-color:#5b2020;background:#1f0d0d;}
  .ghost-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:6px 12px;border-radius:8px;font-size:13px;transition:.15s;
  }
  .ghost-btn:hover{color:var(--text);border-color:#3a4655;}
  #menuBtn{display:none;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:16px;}

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;
    grid-template-columns:290px minmax(0,1fr) minmax(0,1.08fr);
    height:calc(100vh - 56px);
  }
  .sidebar{
    background:var(--panel-2);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding-bottom:40px;
  }
  .sidebar-head{
    padding:16px 18px 10px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .module{margin-bottom:6px;}
  .module-title{
    padding:10px 18px 6px;font-size:12px;font-weight:700;color:#7c8b9d;letter-spacing:.4px;
    text-transform:uppercase;
  }
  .lesson-item{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:transparent;border:0;color:var(--muted);
    padding:7px 18px 7px 14px;font-size:13.5px;line-height:1.4;
    border-left:3px solid transparent;transition:.12s;
  }
  .lesson-item:hover{background:#151d28;color:var(--text);}
  .lesson-item.active{background:#16202c;color:#fff;border-left-color:var(--accent);}
  .lesson-item.done{color:#9fb8a8;}
  .lesson-item .check{
    flex:0 0 16px;height:16px;margin-top:2px;border-radius:50%;
    border:1.5px solid #33404f;font-size:10px;line-height:13px;text-align:center;color:transparent;
  }
  .lesson-item.done .check{background:var(--accent);border-color:var(--accent);color:#04140a;font-weight:900;}
  .lesson-item.active .check{border-color:var(--accent);}

  /* ---------- LESSON PANE ---------- */
  .lesson-pane{overflow-y:auto;padding:30px 40px 90px;background:var(--bg);}
  .crumb{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#5f7d99;font-weight:700;margin-bottom:6px;}
  .lesson-pane h1{font-size:27px;margin:0 0 20px;line-height:1.25;letter-spacing:-.3px;}
  .theory p{margin:0 0 13px;color:#c6d2de;}
  .theory ul,.theory ol{margin:0 0 13px;padding-left:22px;color:#c6d2de;}
  .theory li{margin-bottom:5px;}
  .theory pre{
    background:#0d131b;border:1px solid var(--border);border-left:3px solid #2b6cb0;
    border-radius:8px;padding:13px 15px;overflow-x:auto;margin:0 0 14px;
    font-family:var(--mono);font-size:13.5px;line-height:1.55;color:#cfe3ff;
  }
  .theory code,.task-box code{
    background:#1a2330;border:1px solid #263242;border-radius:5px;
    padding:1px 6px;font-family:var(--mono);font-size:13px;color:#8ee7b0;
  }
  .theory b{color:#fff;}
  .theory h4{margin:22px 0 10px;font-size:15px;color:#fff;}

  .task-box{
    margin-top:26px;background:#101a16;border:1px solid #1d4d33;
    border-radius:12px;padding:18px 20px;
  }
  .task-box h3{margin:0 0 10px;font-size:15px;color:var(--accent);letter-spacing:.3px;}
  .task-box p{margin:0 0 10px;color:#c6d2de;}
  .task-box pre{
    background:#0a1210;border:1px solid #1d4d33;border-radius:8px;padding:11px 14px;
    font-family:var(--mono);font-size:13.5px;color:#a7f3c9;overflow-x:auto;margin:0 0 12px;
  }
  .task-box ul{margin:0 0 10px;padding-left:22px;color:#c6d2de;}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .actions button{
    padding:9px 16px;border-radius:9px;border:1px solid var(--border);
    background:#161e29;color:var(--text);font-size:13.5px;transition:.15s;
  }
  .actions button:hover{background:#1d2735;border-color:#3a4655;}
  .actions button.primary{background:#16a34a;border-color:#16a34a;color:#04140a;font-weight:700;}
  .actions button.primary:hover{background:#22c55e;}
  .hint{
    margin-top:16px;background:#1d1a0e;border:1px solid #57480f;border-radius:10px;
    padding:13px 16px;color:#f6e6a8;font-size:14px;
  }
  .success{
    margin-top:18px;background:#0c2016;border:1px solid #1d7a45;border-radius:10px;
    padding:16px 18px;color:#b8f5cf;font-size:14.5px;
  }
  .success b{color:#4ade80;}
  .hidden{display:none !important;}

  /* ---------- WORKSPACE ---------- */
  .work-pane{
    display:flex;flex-direction:column;min-width:0;
    background:var(--panel-2);border-left:1px solid var(--border);overflow:hidden;
  }
  .editor-toolbar{
    display:flex;align-items:center;gap:10px;padding:9px 14px;
    border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;
  }
  .editor-toolbar .file{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);
    background:#0d131b;border:1px solid var(--border);border-radius:6px;padding:3px 10px;
  }
  .editor-toolbar .spacer{flex:1;}
  .tb-btn{
    padding:7px 14px;border-radius:8px;border:1px solid var(--border);
    background:#161e29;color:var(--text);font-size:13px;transition:.15s;
  }
  .tb-btn:hover{background:#1d2735;}
  .tb-btn.run{background:#16a34a;border-color:#16a34a;color:#04140a;font-weight:700;}
  .tb-btn.run:hover{background:#22c55e;}
  .tb-btn:disabled{opacity:.45;cursor:not-allowed;}

  .editor-wrap{
    position:relative;flex:1 1 46%;min-height:150px;display:flex;overflow:hidden;background:#0a0f15;
  }
  .gutter{
    flex:0 0 46px;overflow:hidden;padding:14px 8px 14px 0;text-align:right;
    font-family:var(--mono);font-size:13.5px;line-height:1.6;color:#3c4a5a;
    background:#0a0f15;border-right:1px solid #1a222c;user-select:none;
  }
  #editor{
    flex:1;resize:none;border:0;outline:none;background:transparent;color:#dbe7f3;
    font-family:var(--mono);font-size:13.5px;line-height:1.6;padding:14px 16px;
    tab-size:4;white-space:pre;overflow:auto;
  }
  #editor::selection{background:#26456b;}

  .pane-head{
    display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:11.5px;
    letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:#6c7d90;
    background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  }
  #console{
    flex:1 1 26%;min-height:90px;margin:0;overflow:auto;padding:12px 16px;
    font-family:var(--mono);font-size:13px;line-height:1.55;color:#a8e6b8;
    background:#080d12;white-space:pre-wrap;word-break:break-word;
  }
  #console.error{color:#ff9c9c;}
  #console.muted{color:#5d6b7c;}

  #tests{
    flex:0 0 auto;max-height:34%;overflow:auto;list-style:none;margin:0;
    padding:10px 14px 16px;background:var(--panel-2);
  }
  #tests li{
    display:flex;gap:10px;align-items:flex-start;font-size:13.5px;
    padding:6px 0;color:var(--muted);border-bottom:1px dashed #1a222c;
  }
  #tests li:last-child{border-bottom:0;}
  #tests li .mark{flex:0 0 18px;font-weight:900;font-size:14px;}
  #tests li.pass{color:#a7e8c4;}
  #tests li.pass .mark{color:var(--accent);}
  #tests li.fail{color:#e8a7a7;}
  #tests li.fail .mark{color:var(--red);}
  .tests-empty{color:#4e5c6d;font-size:13px;font-style:italic;}

  .overlay{
    position:fixed;inset:0;background:rgba(5,8,12,.92);z-index:200;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    text-align:center;padding:30px;
  }
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:3px solid #1e2a38;border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .overlay h2{margin:0;font-size:19px;}
  .overlay p{margin:0;color:var(--muted);font-size:14px;max-width:460px;}

  /* ---------- SCROLLBARS ---------- */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#222d3a;border-radius:99px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#2f3d4d;background-clip:content-box;}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:1100px){
    .layout{grid-template-columns:250px minmax(0,1fr) minmax(0,1fr);}
    .lesson-pane{padding:24px 24px 80px;}
  }
  @media (max-width:900px){
    #menuBtn{display:block;}
    .progress-wrap{display:none;}
    .layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);}
    .lesson-pane{grid-row:1;padding:20px 18px 60px;}
    .work-pane{grid-row:2;border-left:0;border-top:1px solid var(--border);}
    .sidebar{
      position:fixed;top:56px;left:0;bottom:0;width:280px;z-index:100;
      transform:translateX(-100%);transition:transform .22s ease;
      box-shadow:0 0 40px rgba(0,0,0,.6);
    }
    .sidebar.open{transform:translateX(0);}
  }
</style>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" title="Меню">☰</button>
  <div class="brand"><span class="logo">Py</span><span>PyCamp</span></div>
  <div class="progress-wrap">
    <div class="progress-bar"><div id="progressFill"></div></div>
    <span id="progressText">0 / 0</span>
  </div>
  <div class="spacer" style="flex:1"></div>
  <div class="status" id="pyStatus">Загрузка Python…</div>
  <button class="ghost-btn" id="resetBtn">Сбросить прогресс</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">Курс Python</div>
    <nav id="curriculum"></nav>
  </aside>

  <main class="lesson-pane" id="lessonPane">
    <article id="lessonContent"></article>
  </main>

  <section class="work-pane">
    <div class="editor-toolbar">
      <span class="file">main.py</span>
      <span class="spacer"></span>
      <button class="tb-btn" id="resetCodeBtn">↺ Сбросить код</button>
      <button class="tb-btn run" id="runBtn" disabled>▶ Запустить</button>
    </div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
    </div>
    <div class="pane-head">Вывод программы</div>
    <pre id="console" class="muted">Нажмите «Запустить», чтобы выполнить код.</pre>
    <div class="pane-head">Проверки</div>
    <ul id="tests"><li class="tests-empty">Проверки появятся после запуска кода.</li></ul>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <h2>Загружаем Python…</h2>
  <p>Интерпретатор Python работает прямо в вашем браузере. Первая загрузка может занять 10–20 секунд.</p>
</div>

<script>
/* =========================================================================
   КУРС
   ========================================================================= */
const COURSE = [

/* ======================= МОДУЛЬ 1 ======================= */
{
  title: "Модуль 1. Первые шаги",
  lessons: [
    {
      id: "m1l1",
      title: "Первая программа: print()",
      theory: `<p><b>Python</b> — один из самых популярных языков программирования в мире. На нём пишут сайты, анализируют данные, обучают нейросети и автоматизируют рутину.</p>
<p>Программа на Python — это набор инструкций, которые выполняются сверху вниз, строка за строкой. Первая программа традиционно выводит приветствие:</p>
<pre>print("Привет, мир!")</pre>
<p><code>print()</code> — встроенная функция, которая выводит значение на экран и добавляет перевод строки в конце.</p>
<p>Текст в Python называют <b>строкой</b> и записывают в кавычках — одинарных <code>'...'</code> или двойных <code>"..."</code>. Оба варианта равнозначны.</p>
<p>Обратите внимание: имя функции всегда пишется строчными буквами — <code>print</code>, а не <code>Print</code>.</p>`,
      task: `<p>Напишите программу, которая выводит на экран ровно одну строку:</p><pre>Привет, мир!</pre>`,
      starter: `# Напишите ваш код ниже\n`,
      tests: [`__output__.strip() == 'Привет, мир!'`],
      testLabels: ["Программа выводит «Привет, мир!»"],
      hint: `Используйте print("Привет, мир!"). Кавычки обязательны — без них Python решит, что Привет — это имя переменной.`,
      solution: `print("Привет, мир!")`
    },
    {
      id: "m1l2",
      title: "Переменные и комментарии",
      theory: `<p><b>Переменная</b> — это имя, за которым хранится значение. Переменная создаётся в момент присваивания:</p>
<pre>name = "Анна"
age = 25
height = 1.68
is_student = True</pre>
<p>Знак <code>=</code> — это <b>присваивание</b>, а не сравнение. Читается как «положить значение в переменную».</p>
<p>Python сам определяет тип значения — указывать его заранее не нужно.</p>
<h4>Правила имён</h4>
<ul>
  <li>можно буквы, цифры и подчёркивание <code>_</code>;</li>
  <li>имя не может начинаться с цифры;</li>
  <li>регистр важен: <code>Age</code> и <code>age</code> — разные переменные;</li>
  <li>нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code>…).</li>
</ul>
<p>Стиль Python (PEP 8) рекомендует имена в нижнем регистре с подчёркиваниями: <code>user_name</code>, <code>total_price</code>.</p>
<h4>Комментарии</h4>
<p>Всё, что идёт после символа <code>#</code>, Python игнорирует. Комментарии нужны людям:</p>
<pre># Это комментарий
price = 100  # цена в рублях</pre>`,
      task: `<p>Создайте две переменные:</p>
<ul>
  <li><code>name</code> со значением <code>"Анна"</code></li>
  <li><code>age</code> со значением <code>25</code></li>
</ul>
<p>Затем выведите обе переменные на экран (можно двумя вызовами <code>print()</code>).</p>`,
      starter: `# Создайте переменные и выведите их\n`,
      tests: [
        `name == 'Анна'`,
        `age == 25`,
        `'Анна' in __output__`,
        `'25' in __output__`
      ],
      testLabels: [
        "Переменная name равна «Анна»",
        "Переменная age равна 25",
        "Имя выведено на экран",
        "Возраст выведен на экран"
      ],
      hint: `Сначала name = "Анна", затем age = 25. Для вывода: print(name) и print(age). Число 25 пишется без кавычек, строка — в кавычках.`,
      solution: `name = "Анна"\nage = 25\nprint(name)\nprint(age)`
    },
    {
      id: "m1l3",
      title: "Ввод данных: input()",
      theory: `<p>Функция <code>input()</code> останавливает программу и ждёт, пока пользователь что-то введёт и нажмёт Enter. Результат <b>всегда строка</b>:</p>
<pre>name = input("Как вас зовут? ")
print("Привет, " + name + "!")</pre>
<p>Текст в скобках — <b>подсказка</b> (prompt). Она выводится на экран, но в результат не попадает.</p>
<p>Важно: даже если пользователь введёт <code>42</code>, переменная будет строкой <code>"42"</code>. Чтобы получить число, нужно преобразование типов:</p>
<pre>age = int(input("Сколько вам лет? "))</pre>`,
      task: `<p>Спросите у пользователя имя и выведите приветствие в формате:</p>
<pre>Привет, Анна!</pre>
<p>Восклицательный знак обязателен.</p>`,
      inputData: `Анна`,
      starter: `# Считайте имя и выведите приветствие\n`,
      tests: [`'Привет, Анна!' in __output__`],
      testLabels: ["Выведено приветствие «Привет, Анна!»"],
      hint: `name = input("Введите имя: "), затем print("Привет, " + name + "!") или print(f"Привет, {name}!").`,
      solution: `name = input("Введите имя: ")\nprint("Привет, " + name + "!")`
    },
    {
      id: "m1l4",
      title: "print() подробнее: sep и end",
      theory: `<p>Функция <code>print()</code> умеет принимать несколько аргументов. По умолчанию они разделяются пробелом:</p>
<pre>print("Python", "это", "круто")
# Python это круто</pre>
<p>Поведение можно изменить двумя именованными параметрами:</p>
<ul>
  <li><code>sep</code> — разделитель между аргументами (по умолчанию пробел);</li>
  <li><code>end</code> — что печатать в конце (по умолчанию перевод строки).</li>
</ul>
<pre>print("a", "b", "c", sep="-")     # a-b-c
print("Без переноса", end="")
print(" строки")                    # Без переноса строки
print(1, 2, 3, sep="\\n")           # каждое число на своей строке</pre>
<p>Обратите внимание: строки <code>"a"</code> и <code>"b"</code> в примере выше — это уже готовые строки, а не переменные.</p>`,
      task: `<p>Одним вызовом <code>print()</code> выведите три слова через пробел:</p>
<pre>Python это круто</pre>`,
      starter: `# Один вызов print с тремя аргументами\n`,
      tests: [`__output__.strip() == 'Python это круто'`],
      testLabels: ["Выведена строка «Python это круто» одним вызовом print"],
      hint: `Передайте три строки через запятую: print("Python", "это", "круто"). Разделитель по умолчанию — пробел.`,

const STORAGE_KEY = "pycamp-progress-v1";

let state = {
  completed: {},
  code: {},
  current: null
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.completed = parsed.completed || {};
      state.code = parsed.code || {};
      state.current = parsed.current || null;
    }
  } catch (e) { /* ignore */ }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completed: state.completed,
      code: state.code,
      current: state.current
    }));
  } catch (e) { /* ignore */ }
}

/* Плоский список уроков */
const ALL_LESSONS = [];
COURSE.forEach((mod, mi) => {
  mod.lessons.forEach(lesson => {
    lesson._module = mod.title;
    lesson._moduleIndex = mi;
    ALL_LESSONS.push(lesson);
  });
});

function lessonIndex(id) {
  return ALL_LESSONS.findIndex(l => l.id === id);
}
function getLesson(id) {
  return ALL_LESSONS.find(l => l.id === id) || ALL_LESSONS[0];
}

const PY_HELPER = `
import sys, io, traceback, json as _json

def _pycamp_check(src, ns):
    try:
        return bool(eval(compile(src, '<test>', 'eval'), ns))
    except SyntaxError:
        pass
    except BaseException:
        return False
    ns.pop('__ok__', None)
    try:
        exec(compile(src, '<test>', 'exec'), ns)
    except BaseException:
        return False
    return bool(ns.get('__ok__', False))

def run_student(code, tests, input_data):
    ns = {'__name__': '__main__'}
    lines = input_data.split('\\n') if input_data else []
    it = iter(lines)
    def _input(prompt=''):
        if prompt:
            sys.stdout.write(str(prompt))
        try:
            return next(it)
        except StopIteration:
            raise EOFError('Закончились входные данные')
    ns['input'] = _input

    buf = io.StringIO()
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = buf
    sys.stderr = buf
    error = ''
    try:
        exec(compile(code, '<main>', 'exec'), ns)
    except BaseException as e:
        try:
            error = ''.join(traceback.format_exception_only(type(e), e)).strip()
        except BaseException:
            error = str(e)
    finally:
        sys.stdout = old_out
        sys.stderr = old_err

    output = buf.getvalue()
    ns['__output__'] = output

    results = []
    for t in tests:
        try:
            results.append(bool(_pycamp_check(t, ns)))
        except BaseException:
            results.append(False)

    return _json.dumps({'output': output, 'error': error, 'results': results})
`;

async function initPyodide() {

    runStudentPy = pyodide.globals.get("run_student");

function renderCurriculum() {
  let html = "";
  COURSE.forEach((mod) => {
    html += '<div class="module"><div class="module-title">' + escapeHtml(mod.title) + "</div>";
    mod.lessons.forEach((lesson) => {
      const done = !!state.completed[lesson.id];
      const active = lesson.id === state.current;
      html +=
        '<button class="lesson-item' + (active ? " active" : "") + (done ? " done" : "") +
        '" data-id="' + lesson.id + '">' +
        '<span class="check">' + (done ? "✓" : "") + "</span>" +
        '<span class="lesson-title">' + escapeHtml(lesson.title) + "</span>" +
        "</button>";
    });
    html += "</div>";
  });
  curriculumEl.innerHTML = html;
  curriculumEl.querySelectorAll(".lesson-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      openLesson(btn.dataset.id);
      sidebar.classList.remove("open");
    });
  });
  updateProgress();
}

function updateProgress() {
  const total = ALL_LESSONS.length;
  const done = ALL_LESSONS.filter(l => state.completed[l.id]).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  progressFill.style.width = pct + "%";
  progressText.textContent = done + " / " + total + " (" + pct + "%)";
}

  html += '<div class="actions">';
  html += '<button id="hintBtn">💡 Подсказка</button>';
  html += '<button id="solBtn">👁 Показать решение</button>';
  if (!isLast) html += '<button id="nextBtn" class="primary">Следующий урок →</button>';
  else html += '<button id="nextBtn" class="primary" disabled>🏁 Это последний урок</button>';
  html += "</div>";

  html += '<div id="hintBox" class="hint hidden"></div>';
  html += '<div id="successBox" class="success hidden"></div>';

  lessonContent.innerHTML = html;

  const hintBox = $("#hintBox");
  $("#hintBtn").addEventListener("click", () => {
    hintBox.textContent = l.hint || "Подсказка недоступна.";
    hintBox.classList.remove("hidden");
  });

  $("#solBtn").addEventListener("click", () => {
    if (confirm("Показать решение? Ваш текущий код будет заменён.")) {
      editor.value = l.solution;
      state.code[l.id] = l.solution;
      saveState();
      updateGutter();
    }
  });

  const nextBtn = $("#nextBtn");
  if (!isLast) {
    nextBtn.addEventListener("click", () => {
      const next = ALL_LESSONS[idx + 1];
      if (next) openLesson(next.id);
    });
  }

  if (state.completed[l.id]) {
    showSuccessBox();
  }

  lessonPane.scrollTop = 0;
}

function showSuccessBox() {
  const box = $("#successBox");
  if (!box) return;
  const idx = lessonIndex(state.current);
  const isLast = idx === ALL_LESSONS.length - 1;
  box.innerHTML = isLast
    ? "<b>Поздравляем!</b> Вы прошли весь курс. 🎉 Возвращайтесь к проектам и пишите свои программы!"
    : "<b>Отлично!</b> Урок пройден. Переходите к следующему.";
  box.classList.remove("hidden");
}

function openLesson(id) {
  if (state.current && editor.value !== undefined) {
    state.code[state.current] = editor.value;
  }
  state.current = id;
  saveState();

  const l = getLesson(id);
  editor.value = state.code[id] !== undefined ? state.code[id] : l.starter;
  updateGutter();

  setConsole("Нажмите «Запустить», чтобы выполнить код.", "muted");
  testsEl.innerHTML = '<li class="tests-empty">Проверки появятся после запуска кода.</li>';

  renderCurriculum();
  renderLesson();
}

/* =========================================================================
   РЕДАКТОР
   ========================================================================= */
function updateGutter() {
  const lines = editor.value.split("\n").length;
  let out = "";
  for (let i = 1; i <= lines; i++) out += i + "\n";
  gutter.textContent = out;
  gutter.scrollTop = editor.scrollTop;
}

editor.addEventListener("input", () => {
  updateGutter();
  if (state.current) {
    state.code[state.current] = editor.value;
    saveState();
  }
});
editor.addEventListener("scroll", () => {
  gutter.scrollTop = editor.scrollTop;
});
editor.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = editor.selectionStart, en = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + "    " + editor.value.slice(en);
    editor.selectionStart = editor.selectionEnd = s + 4;
    updateGutter();
    if (state.current) { state.code[state.current] = editor.value; saveState(); }
  } else if (e.key === "Enter") {
    const s = editor.selectionStart;
    const before = editor.value.slice(0, s);
    const lineStart = before.lastIndexOf("\n") + 1;
    const line = before.slice(lineStart);
    const indentMatch = line.match(/^[ \t]*/);
    const indent = indentMatch ? indentMatch[0] : "";
    const extra = /:\s*$/.test(line) ? "    " : "";
    if (indent || extra) {
      e.preventDefault();
      const ins = "\n" + indent + extra;
      editor.value = before + ins + editor.value.slice(editor.selectionEnd);
      editor.selectionStart = editor.selectionEnd = s + ins.length;
      updateGutter();
      if (state.current) { state.code[state.current] = editor.value; saveState(); }
    }
  }
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    runCode();
  }
});

/* =========================================================================
   ЗАПУСК И ПРОВЕРКИ
   ========================================================================= */
function setConsole(text, cls) {
  consoleEl.textContent = text;
  consoleEl.className = cls || "";
}

function renderTests(lesson, results) {
  let html = "";
  lesson.testLabels.forEach((label, i) => {
    const ok = !!results[i];
    html += '<li class="' + (ok ? "pass" : "fail") + '">' +
      '<span class="mark">' + (ok ? "✓" : "✕") + "</span>" +
      "<span>" + escapeHtml(label) + "</span></li>";
  });
  testsEl.innerHTML = html;
}

async function runCode() {
  if (!pyReady) return;
  const l = getLesson(state.current);
  const code = editor.value;

  state.code[l.id] = code;
  saveState();

  runBtn.disabled = true;
  const oldLabel = runBtn.textContent;
  runBtn.textContent = "⏳ Выполняется…";
  setConsole("Выполняется…", "muted");
  testsEl.innerHTML = '<li class="tests-empty">Проверка…</li>';

  await new Promise(r => setTimeout(r, 30));

  try {
    const json = runStudentPy(code, pyodide.toPy(l.tests || []), l.inputData || "");
    const res = JSON.parse(json);

    let out = res.output || "";
    if (res.error) {
      out += (out && !out.endsWith("\n") ? "\n" : "") + res.error;
    }
    if (!out) out = "(программа не вывела ничего)";
    setConsole(out, res.error ? "error" : "");

    renderTests(l, res.results);

    const allPassed = res.results.length > 0 && res.results.every(Boolean) && !res.error;
    if (allPassed) {
      if (!state.completed[l.id]) {
        state.completed[l.id] = true;
        saveState();
        renderCurriculum();
      }
      showSuccessBox();
    } else {
      const box = $("#successBox");
      if (box) box.classList.add("hidden");
      if (!state.completed[l.id]) {
        // остаётся невыполненным
      }
    }
  } catch (err) {
    setConsole("Внутренняя ошибка выполнения: " + (err && err.message ? err.message : err), "error");
    testsEl.innerHTML = '<li class="tests-empty">Не удалось выполнить проверки.</li>';
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = oldLabel;
  }
}

runBtn.addEventListener("click", runCode);
resetCodeBtn.addEventListener("click", () => {
  const l = getLesson(state.current);
  if (confirm("Сбросить код к исходному состоянию?")) {
    editor.value = l.starter;
    state.code[l.id] = l.starter;
    saveState();
    updateGutter();
  }
});

resetBtn.addEventListener("click", () => {
  if (confirm("Сбросить весь прогресс и код? Это действие необратимо.")) {
    state = { completed: {}, code: {}, current: ALL_LESSONS[0].id };
    saveState();
    openLesson(ALL_LESSONS[0].id);
  }
});

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("open");
});

/* =========================================================================
   УТИЛИТЫ
   ========================================================================= */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* =========================================================================
   СТАРТ
   ========================================================================= */
loadState();
renderCurriculum();
openLesson(state.current && getLesson(state.current) ? state.current : ALL_LESSONS[0].id);
initPyodide();
</script>
</body>
</html>
