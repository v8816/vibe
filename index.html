<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #f0f6fc;
            font-size: 1.8rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-list a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }

        .nav-list a:hover {
            background-color: #1c2333;
            border-color: #58a6ff;
            transform: translateX(4px);
        }

        .nav-list a .icon {
            font-size: 1.3rem;
        }

        .nav-list a .label {
            flex: 1;
        }

        .nav-list a .arrow {
            color: #484f58;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .nav-list a:hover .arrow {
            color: #58a6ff;
        }
    </style>
</head>
