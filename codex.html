<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>PyPath — полный курс Python</title>
<style>
:root{--bg:#0d1117;--panel:#151b24;--panel2:#1b2430;--line:#2a3544;--text:#e8eef6;--muted:#9aa9bb;--green:#42d392;--blue:#79b8ff;--yellow:#ffd166;--red:#ff7b82;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow:auto;padding:22px 16px;background:#10151d}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--green);color:#062317;font-size:22px;font-weight:900}.brand strong{font-size:19px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:12px}.progress-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:20px}.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}.track{height:7px;background:#283342;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:var(--green);transition:width .3s}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#728196;padding:10px 10px 6px;font-weight:800}.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:#bdc9d8;background:transparent;border:0;border-radius:10px;padding:10px;margin:2px 0}.nav-item:hover,.nav-item.active{background:#202b38;color:#fff}.nav-item.active{box-shadow:inset 3px 0 var(--green)}.nav-item .num{width:23px;height:23px;border:1px solid #3b4757;border-radius:7px;display:grid;place-items:center;font-size:11px;flex-shrink:0}.nav-item.done .num{background:var(--green);color:#092317;border-color:var(--green)}.nav-item .nav-title{flex:1;font-size:13px}.nav-item .check{color:var(--green)}main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,52px);position:sticky;top:0;background:#0d1117ed;backdrop-filter:blur(14px);z-index:3}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px}.ghost,.primary,.soft{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--panel);color:var(--text)}.primary{background:var(--green);border-color:var(--green);color:#082216;font-weight:800}.soft{background:#202b38}.content{max-width:1120px;margin:auto;padding:38px clamp(18px,4vw,52px) 70px}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:900}.hero{padding:26px 0 30px}.hero h1{font-size:clamp(32px,5vw,54px);letter-spacing:-2px;line-height:1.06;margin:12px 0}.hero p{color:var(--muted);max-width:700px;font-size:17px}.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:24px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.lesson-head{margin-bottom:25px}.lesson-head h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.3px;line-height:1.15;margin:8px 0}.lesson-head p{color:var(--muted);font-size:16px;max-width:760px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}.article,.side-card,.exercise{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:23px;margin-bottom:18px;min-width:0}.article h2,.exercise h2{font-size:21px;margin:0 0 12px;letter-spacing:-.5px}.article h3{font-size:16px;margin:24px 0 8px}.article p{color:#c6d1df}.article ul{padding-left:22px;color:#c6d1df}.article li{margin:7px 0}.callout{border-left:3px solid var(--blue);background:#182637;padding:13px 15px;border-radius:0 10px 10px 0;margin:16px 0;color:#d8e8fa}.callout.warn{border-color:var(--yellow);background:#2a261b}.codebox{background:#0a0e14;border:1px solid #2a3544;border-radius:12px;overflow:hidden;margin:14px 0}.code-top{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #222c38;color:#8ea0b5;font-size:12px}.codebox textarea{display:block;width:100%;min-height:130px;resize:vertical;background:transparent;color:#dce8f7;border:0;outline:none;padding:15px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}.run-row{display:flex;gap:8px;padding:0 12px 12px;align-items:center;flex-wrap:wrap}.output{background:#080b10;color:#b8f4d7;padding:12px;border-radius:9px;min-height:42px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace;margin:0 12px 12px}.output.error{color:#ff9da3}.small{font-size:12px;color:var(--muted)}.exercise{border-color:#365143}.exercise .tag{display:inline-block;font-size:11px;color:var(--green);font-weight:900;letter-spacing:1px;margin-bottom:8px}.task{font-size:16px;color:#d8e2ee}.hint{color:var(--yellow);font-size:13px;margin:10px 0}.quiz-option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#111720;color:var(--text);padding:12px;border-radius:10px;margin:8px 0}.quiz-option:hover{border-color:#687b91}.quiz-option.correct{border-color:var(--green);background:#123022}.quiz-option.wrong{border-color:var(--red);background:#321a20}.feedback{font-size:13px;margin-top:10px;color:var(--muted)}.side-card h3{font-size:14px;margin:0 0 12px}.side-card p,.side-card li{color:var(--muted);font-size:13px}.side-card ul{padding-left:17px}.side-card li{margin:8px 0}.lesson-footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}.lesson-footer button{padding:12px 16px}.welcome-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.feature{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.feature .emoji{font-size:23px}.feature b{display:block;margin:7px 0}.feature p{font-size:13px;color:var(--muted);margin:0}.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module-card{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:16px;text-align:left;color:var(--text)}.module-card:hover{border-color:#617b90;transform:translateY(-1px)}.module-card .meta{color:var(--muted);font-size:12px}.module-card h3{font-size:15px;margin:8px 0}.module-card p{font-size:13px;color:var(--muted);margin:0}.search{width:100%;background:#151b24;color:var(--text);border:1px solid var(--line);padding:11px 13px;border-radius:10px;margin:4px 0 14px;outline:none}.search:focus{border-color:var(--green)}.empty{padding:35px;text-align:center;color:var(--muted)}.mobile-menu{display:none}.footer-note{color:#647386;font-size:12px;margin-top:25px}.kbd{font:11px monospace;border:1px solid #3a4656;border-radius:5px;padding:2px 5px;color:#aab8c8}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:8;left:-300px;width:280px;transition:left .25s;box-shadow:10px 0 35px #0008}aside.open{left:0}.mobile-menu{display:inline-block}.layout{grid-template-columns:1fr}.right-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.right-col .side-card{margin:0}.content{padding-top:25px}}@media(max-width:600px){.welcome-grid,.module-grid,.right-col{grid-template-columns:1fr}.topbar{padding:0 14px}.crumb{display:none}.content{padding-left:15px;padding-right:15px}.article,.exercise,.side-card{padding:17px}.hero-stats{gap:16px}.lesson-footer{flex-direction:column}.lesson-footer button{width:100%}}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar">
  <div class="brand"><div class="logo">Py</div><div><strong>PyPath</strong><small>Путь от нуля до Python</small></div></div>
  <div class="progress-card"><div class="progress-top"><span>Твой прогресс</span><b id="progressText">0%</b></div><div class="track"><div class="fill" id="progressFill"></div></div><div class="small" id="progressDetail" style="margin-top:8px">0 из 24 уроков завершено</div></div>
  <div class="section-label">Обучение</div>
  <button class="nav-item active" data-home><span class="num">⌂</span><span class="nav-title">Главная</span></button>
  <div class="section-label">Программа курса</div>
  <nav id="lessonNav"></nav>
  <div style="padding:15px 9px"><button class="ghost" id="resetBtn" style="width:100%">Сбросить прогресс</button></div>
</aside>
<main>
  <header class="topbar"><div style="display:flex;gap:10px;align-items:center"><button class="ghost mobile-menu" id="menuBtn" aria-label="Открыть меню">☰</button><span class="crumb" id="crumb">PyPath / Главная</span></div><div class="top-actions"><button class="ghost" id="searchBtn">⌕ Поиск урока</button><button class="primary" id="continueBtn">Продолжить →</button></div></header>
  <div class="content" id="view"></div>
</main>
</div>
<script>
const lessons = [
{module:"Старт",title:"Знакомство с Python",time:"10 мин",desc:"Что такое Python, где он применяется и как выглядит программа.",goals:["Понять, что такое язык программирования","Запустить первую команду print()"],body:`<h2>Что такое Python?</h2><p>Python — язык программирования с простым и читаемым синтаксисом. На нём создают сайты, автоматизацию, игры, анализ данных и приложения машинного обучения.</p><h3>Первая программа</h3><p>Функция <code>print()</code> выводит информацию. Текст нужно заключать в кавычки.</p><div class="codebox"><div class="code-top"><span>main.py</span><button class="ghost copy-sample">Копировать</button></div><textarea class="sample-code">print("Привет, мир!")\nprint("Я изучаю Python")</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button><span class="small">Запуск в браузере через Pyodide</span></div><pre class="output">Нажми «Запустить код»</pre></div><div class="callout">Важно: Python выполняет инструкции сверху вниз. Ошибка в одной строке может остановить выполнение программы.</div>`,task:"Выведи две строки: своё приветствие и фразу «Я учу Python».",starter:'print("Привет!")\nprint("Я учу Python")',tests:[{label:"Есть команда print()",test:c=>/print\s*\(/.test(c)},{label:"Выводятся минимум две строки",test:c=>(c.match(/print\s*\(/g)||[]).length>=2}]},
{module:"Старт",title:"Переменные и типы данных",time:"15 мин",desc:"Сохраняем значения в переменных и разбираемся с базовыми типами.",goals:["Создавать переменные","Различать str, int, float и bool"],body:`<h2>Переменная — именованное значение</h2><p>Переменная хранит данные, к которым можно обратиться по имени. Знак <code>=</code> присваивает значение.</p><div class="codebox"><div class="code-top"><span>Пример</span><button class="ghost copy-sample">Копировать</button></div><textarea class="sample-code">name = "Аня"       # str — строка\nage = 17           # int — целое число\nheight = 1.72      # float — дробное число\nis_student = True  # bool — истина или ложь\nprint(name, age)\nprint(type(height))</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>Правила именования</h3><ul><li>Имя может содержать буквы, цифры и подчёркивания.</li><li>Нельзя начинать имя с цифры.</li><li>Регистр имеет значение: <code>score</code> и <code>Score</code> — разные имена.</li><li>Для переменных обычно используют <code>snake_case</code>.</li></ul>`,task:"Создай переменные name и age, присвой им строку и число, затем выведи обе переменные.",starter:'name = "Владимир"\nage = 16\nprint(name)\nprint(age)',tests:[{label:"Создана переменная name",test:c=>/\bname\s*=/.test(c)},{label:"Создана переменная age",test:c=>/\bage\s*=/.test(c)},{label:"Используется print()",test:c=>/print\s*\(/.test(c)}]},
{module:"Старт",title:"Ввод и вывод",time:"15 мин",desc:"Получаем данные от пользователя с помощью input().",goals:["Использовать input()","Преобразовывать ввод в число"],body:`<h2>Получаем данные</h2><p><code>input()</code> останавливает программу и ждёт ввод пользователя. В интерактивном примере ниже ввод можно указать в поле перед запуском.</p><div class="codebox"><div class="code-top"><span>Ввод пользователя</span></div><textarea class="sample-code">name = input("Как тебя зовут? ")\nprint("Привет,", name)</textarea><div class="run-row"><input class="stdin-input search" style="margin:0;max-width:240px" placeholder="Текст для input()" value="Владимир"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>Почему нужен int()?</h3><p>Функция <code>input()</code> возвращает строку даже тогда, когда пользователь ввёл цифры. Для математических операций преобразуй её через <code>int()</code> или <code>float()</code>.</p><pre class="output" style="color:#cbd7e6">age = int(input("Возраст: "))\nprint(age + 1)</pre>`,task:"Спроси имя пользователя через input() и выведи приветствие с этим именем.",starter:'name = input("Как тебя зовут? ")\nprint("Привет,", name)',tests:[{label:"Есть input()",test:c=>/input\s*\(/.test(c)},{label:"Есть print()",test:c=>/print\s*\(/.test(c)}]},
{module:"Основы",title:"Числа и арифметика",time:"15 мин",desc:"Арифметические операторы, деление, остаток и приоритет операций.",goals:["Использовать арифметические операторы","Понимать //, % и **"],body:`<h2>Арифметические операторы</h2><ul><li><code>+</code> сложение, <code>-</code> вычитание</li><li><code>*</code> умножение, <code>/</code> обычное деление</li><li><code>//</code> целочисленное деление</li><li><code>%</code> остаток от деления</li><li><code>**</code> возведение в степень</li></ul><div class="codebox"><div class="code-top"><span>Пример</span></div><textarea class="sample-code">print(7 / 2)   # 3.5\nprint(7 // 2)  # 3\nprint(7 % 2)   # 1\nprint(2 ** 4)  # 16</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><div class="callout">Остаток от деления на 2 помогает проверить чётность: если <code>number % 2 == 0</code>, число чётное.</div>`,task:"Вычисли сумму чисел 14 и 9, остаток от деления 14 на 5 и 3 в степени 4. Выведи каждый результат.",starter:'print(14 + 9)\nprint(14 % 5)\nprint(3 ** 4)',tests:[{label:"Есть сложение",test:c=>/14\s*\+\s*9|9\s*\+\s*14/.test(c)},{label:"Есть остаток от деления",test:c=>/%/.test(c)},{label:"Есть степень",test:c=>/\*\*/.test(c)}]},
{module:"Основы",title:"Строки и форматирование",time:"20 мин",desc:"Работа с текстом, индексами, срезами и f-строками.",goals:["Объединять и изменять строки","Использовать f-строки"],body:`<h2>Строки</h2><p>Строка — последовательность символов. Индексация начинается с нуля, отрицательные индексы считают с конца.</p><div class="codebox"><div class="code-top"><span>Строки</span></div><textarea class="sample-code">word = "Python"\nprint(word[0])       # P\nprint(word[-1])      # n\nprint(word[0:3])     # Pyt\nprint(word.upper())  # PYTHON\nprint(len(word))     # 6</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>f-строки</h3><p>Чтобы вставить значение переменной внутрь текста, поставь <code>f</code> перед строкой и заключи имя в фигурные скобки.</p><pre class="output" style="color:#cbd7e6">name = "Мир"\nprint(f"Привет, {name}!")</pre>`,task:"Создай переменную language со значением Python и выведи текст «Я изучаю Python» с помощью f-строки.",starter:'language = "Python"\nprint(f"Я изучаю {language}")',tests:[{label:"Есть переменная language",test:c=>/\blanguage\s*=/.test(c)},{label:"Используется f-строка",test:c=>/f["']/.test(c)}]},
{module:"Основы",title:"Условия if, elif, else",time:"20 мин",desc:"Принимаем решения в программе с помощью условий.",goals:["Сравнивать значения","Строить ветвления"],body:`<h2>Условные конструкции</h2><p>Условие позволяет выполнить код только при выполнении определённого правила. После <code>if</code>, <code>elif</code> и <code>else</code> ставится двоеточие, а тело блока выделяется отступом.</p><div class="codebox"><div class="code-top"><span>Условие</span></div><textarea class="sample-code">score = 78\nif score >= 90:\n    print("Отлично")\nelif score >= 60:\n    print("Зачёт")\nelse:\n    print("Нужно повторить")</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Операторы сравнения: <code>==</code>, <code>!=</code>, <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>. Для логики используют <code>and</code>, <code>or</code>, <code>not</code>.</p>`,task:"Создай переменную age. Если возраст не меньше 18, выведи «Доступ разрешён», иначе — «Доступ запрещён».",starter:'age = 16\nif age >= 18:\n    print("Доступ разрешён")\nelse:\n    print("Доступ запрещён")',tests:[{label:"Есть if и else",test:c=>/\bif\b/.test(c)&&/\belse\s*:/.test(c)},{label:"Есть проверка возраста",test:c=>/age\s*>=\s*18/.test(c)},{label:"Выводится сообщение",test:c=>/print\s*\(/.test(c)}]},
{module:"Основы",title:"Цикл while",time:"15 мин",desc:"Повторяем действия, пока условие истинно.",goals:["Писать циклы while","Избегать бесконечных циклов"],body:`<h2>Повторение с while</h2><p>Цикл <code>while</code> выполняется, пока его условие истинно. Важно изменять переменную условия, иначе цикл может стать бесконечным.</p><div class="codebox"><div class="code-top"><span>Счётчик</span></div><textarea class="sample-code">number = 1\nwhile number <= 5:\n    print(number)\n    number += 1</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p><code>number += 1</code> — короткая запись для <code>number = number + 1</code>.</p>`,task:"Выведи числа от 1 до 5 с помощью цикла while.",starter:'number = 1\nwhile number <= 5:\n    print(number)\n    number += 1',tests:[{label:"Используется while",test:c=>/\bwhile\b/.test(c)},{label:"Условие до 5",test:c=>/<=\s*5/.test(c)},{label:"Счётчик изменяется",test:c=>/\+=\s*1|=\s*\w+\s*\+\s*1/.test(c)}]},
{module:"Основы",title:"Цикл for и range()",time:"20 мин",desc:"Перебираем последовательности и задаём число повторений.",goals:["Использовать for","Понимать range(start, stop, step)"],body:`<h2>Цикл for</h2><p><code>for</code> перебирает элементы последовательности. <code>range(5)</code> создаёт значения от 0 до 4: правая граница не включается.</p><div class="codebox"><div class="code-top"><span>Диапазоны</span></div><textarea class="sample-code">for i in range(5):\n    print(i)\n\nfor i in range(2, 11, 2):\n    print(i)</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>В цикле можно использовать <code>break</code> для остановки и <code>continue</code> для перехода к следующей итерации.</p>`,task:"С помощью for и range() выведи числа от 1 до 10 включительно.",starter:'for i in range(1, 11):\n    print(i)',tests:[{label:"Используется for",test:c=>/\bfor\b/.test(c)},{label:"Используется range()",test:c=>/range\s*\(/.test(c)},{label:"Верхняя граница 11",test:c=>/range\s*\(\s*1\s*,\s*11\s*\)/.test(c)}]},
{module:"Основы",title:"Функции",time:"25 мин",desc:"Выносим логику в повторно используемые блоки кода.",goals:["Объявлять функции через def","Возвращать результат с return"],body:`<h2>Создание функции</h2><p>Функция — именованный блок кода. Параметры принимают входные данные, а <code>return</code> возвращает результат вызывающему коду.</p><div class="codebox"><div class="code-top"><span>Функция</span></div><textarea class="sample-code">def pair_sum(a, b):\n    return a + b\n\nresult = pair_sum(2, 5)\nprint(result)  # 7</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>Параметры и аргументы</h3><p>В определении <code>def greet(name)</code> имя — параметр. При вызове <code>greet("Аня")</code> строка «Аня» — аргумент.</p>`,task:"Напиши функцию square(number), которая возвращает квадрат числа. Вызови её с числом 6 и выведи результат.",starter:'def square(number):\n    return number ** 2\n\nprint(square(6))',tests:[{label:"Есть функция square",test:c=>/def\s+square\s*\(/.test(c)},{label:"Используется return",test:c=>/\breturn\b/.test(c)},{label:"Функция вызывается",test:c=>/square\s*\(\s*6\s*\)/.test(c)}]},
{module:"Структуры данных",title:"Списки",time:"20 мин",desc:"Храним коллекции, обращаемся по индексу и изменяем элементы.",goals:["Создавать списки","Добавлять, удалять и сортировать элементы"],body:`<h2>Список list</h2><p>Список хранит несколько значений в определённом порядке. Он изменяемый, а индексы начинаются с нуля.</p><div class="codebox"><div class="code-top"><span>Списки</span></div><textarea class="sample-code">scores = [10, 20, 30]\nscores.append(40)\nprint(scores)\nprint(scores[0])\nprint(len(scores))\nscores.sort()\nprint(scores)</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Полезные методы: <code>append()</code>, <code>extend()</code>, <code>remove()</code>, <code>pop()</code>, <code>sort()</code>. Срез <code>items[1:3]</code> берёт элементы с индексами 1 и 2.</p>`,task:"Создай список из трёх чисел, добавь четвёртое через append() и выведи список.",starter:'numbers = [3, 6, 9]\nnumbers.append(12)\nprint(numbers)',tests:[{label:"Создан список",test:c=>/\w+\s*=\s*\[/.test(c)},{label:"Используется append()",test:c=>/\.append\s*\(/.test(c)},{label:"Список выводится",test:c=>/print\s*\(/.test(c)}]},
{module:"Структуры данных",title:"Кортежи и множества",time:"15 мин",desc:"Неизменяемые последовательности и коллекции уникальных значений.",goals:["Понимать tuple","Использовать set для уникальности"],body:`<h2>Кортеж tuple</h2><p>Кортеж похож на список, но его элементы нельзя переназначить после создания.</p><pre class="output" style="color:#d8e5f4">point = (10, 20)\nprint(point[0])</pre><h2 style="margin-top:22px">Множество set</h2><p>Множество хранит уникальные значения и не гарантирует привычный порядок элементов.</p><div class="codebox"><div class="code-top"><span>Уникальные значения</span></div><textarea class="sample-code">numbers = [1, 2, 2, 3, 3, 3]\nunique_numbers = set(numbers)\nprint(unique_numbers)\nprint(2 in unique_numbers)</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div>`,task:"Преобразуй список [1, 1, 2, 3, 3] во множество и выведи его.",starter:'numbers = [1, 1, 2, 3, 3]\nunique_numbers = set(numbers)\nprint(unique_numbers)',tests:[{label:"Есть список с повторениями",test:c=>/\[.*1.*1.*2.*3.*3.*\]/s.test(c)},{label:"Используется set()",test:c=>/set\s*\(/.test(c)},{label:"Есть print()",test:c=>/print\s*\(/.test(c)}]},
{module:"Структуры данных",title:"Словари",time:"20 мин",desc:"Храним данные в формате ключ — значение.",goals:["Создавать словари","Получать и обновлять значения"],body:`<h2>Словарь dict</h2><p>Словарь связывает ключи со значениями. Ключи уникальны, а получить значение можно по ключу.</p><div class="codebox"><div class="code-top"><span>Профиль</span></div><textarea class="sample-code">user = {\n    "name": "Аня",\n    "age": 17,\n}\nprint(user["name"])\nuser["age"] = 18\nuser["city"] = "Москва"\nprint(user)</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Метод <code>get()</code> позволяет безопасно получить значение: <code>user.get("email", "не указан")</code>.</p>`,task:"Создай словарь person с ключами name и age, затем выведи имя по ключу.",starter:'person = {"name": "Аня", "age": 17}\nprint(person["name"])',tests:[{label:"Создан словарь",test:c=>/\w+\s*=\s*\{/.test(c)},{label:"Есть ключ name",test:c=>/["']name["']/.test(c)},{label:"Доступ по ключу",test:c=>/\w+\s*\[\s*["']name["']\s*\]/.test(c)}]},
{module:"Структуры данных",title:"Списковые включения",time:"15 мин",desc:"Создаём списки лаконично и читаемо.",goals:["Писать list comprehension","Добавлять фильтр if"],body:`<h2>List comprehension</h2><p>Списковое включение позволяет построить новый список на основе последовательности.</p><div class="codebox"><div class="code-top"><span>Квадраты чисел</span></div><textarea class="sample-code">squares = [n ** 2 for n in range(1, 6)]\nprint(squares)\nevens = [n for n in range(10) if n % 2 == 0]\nprint(evens)</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Не превращай каждое выражение в одну длинную строку. Обычный цикл иногда понятнее.</p>`,task:"Создай список квадратов чисел от 1 до 5 с помощью спискового включения.",starter:'squares = [n ** 2 for n in range(1, 6)]\nprint(squares)',tests:[{label:"Есть списковое включение",test:c=>/\[[^\]]+\bfor\b[^\]]+\]/s.test(c)},{label:"Используется возведение в степень",test:c=>/\*\*/.test(c)},{label:"Есть range()",test:c=>/range\s*\(/.test(c)}]},
{module:"Функции и модули",title:"Область видимости и аргументы",time:"20 мин",desc:"Локальные переменные, значения по умолчанию и именованные аргументы.",goals:["Понимать локальную область видимости","Задавать значения параметров по умолчанию"],body:`<h2>Параметры по умолчанию</h2><div class="codebox"><div class="code-top"><span>Приветствие</span></div><textarea class="sample-code">def greet(name, greeting="Привет"):\n    return f"{greeting}, {name}!"\n\nprint(greet("Мир"))\nprint(greet("Аня", greeting="Доброе утро"))</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Переменная, созданная внутри функции, обычно локальна. Предпочитай передавать нужные данные параметрами и возвращать результат через <code>return</code>.</p>`,task:"Напиши функцию greet(name, greeting='Привет'), которая возвращает приветствие через f-строку.",starter:'def greet(name, greeting="Привет"):\n    return f"{greeting}, {name}!"\n\nprint(greet("Мир"))',tests:[{label:"Есть функция greet",test:c=>/def\s+greet\s*\(/.test(c)},{label:"Есть значение по умолчанию",test:c=>/greeting\s*=\s*["']Привет["']/.test(c)},{label:"Используется return",test:c=>/\breturn\b/.test(c)}]},
{module:"Функции и модули",title:"Модули и pip",time:"20 мин",desc:"Подключаем стандартную библиотеку и сторонние пакеты.",goals:["Импортировать модуль","Понимать роль pip и виртуальных окружений"],body:`<h2>Импорт модулей</h2><p>Модуль — файл с кодом, который можно использовать повторно. Стандартная библиотека идёт вместе с Python.</p><div class="codebox"><div class="code-top"><span>Модуль math</span></div><textarea class="sample-code">import math\n\nprint(math.sqrt(81))\nprint(math.pi)\n\nfrom random import randint\nprint(randint(1, 6))</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>Сторонние библиотеки</h3><p><code>pip</code> устанавливает пакеты, например <code>python -m pip install requests</code>. Для проектов удобно создавать виртуальное окружение: <code>python -m venv .venv</code>.</p><div class="callout warn">Встроенный браузерный интерпретатор может не поддерживать установку любых пакетов через pip. Пример с math работает без установки.</div>`,task:"Импортируй модуль math и выведи квадратный корень из 144.",starter:'import math\nprint(math.sqrt(144))',tests:[{label:"Импортируется math",test:c=>/import\s+math/.test(c)},{label:"Используется sqrt()",test:c=>/sqrt\s*\(/.test(c)},{label:"Есть print()",test:c=>/print\s*\(/.test(c)}]},
{module:"Функции и модули",title:"Ошибки и отладка",time:"20 мин",desc:"Читаем сообщения об ошибках и обрабатываем исключения.",goals:["Различать синтаксические и логические ошибки","Использовать try/except"],body:`<h2>Типы ошибок</h2><ul><li><code>SyntaxError</code> — нарушен синтаксис.</li><li><code>NameError</code> — имя не определено.</li><li><code>TypeError</code> — операция не подходит типу.</li><li><code>ValueError</code> — тип подходит, но значение некорректно.</li><li><code>IndexError</code> — индекс за границами последовательности.</li></ul><div class="codebox"><div class="code-top"><span>Обработка исключения</span></div><textarea class="sample-code">text = "42x"\ntry:\n    number = int(text)\nexcept ValueError:\n    print("Нужно ввести целое число")\nelse:\n    print(number)\nfinally:\n    print("Готово")</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Не скрывай все ошибки без разбора. Обрабатывай ожидаемые исключения и выводи понятные сообщения.</p>`,task:"Создай блок try/except, который ловит ValueError при преобразовании строки в число.",starter:'text = "abc"\ntry:\n    number = int(text)\nexcept ValueError:\n    print("Некорректное число")',tests:[{label:"Есть try",test:c=>/\btry\s*:/.test(c)},{label:"Ловится ValueError",test:c=>/except\s+ValueError/.test(c)},{label:"Преобразование в int",test:c=>/int\s*\(/.test(c)}]},
{module:"Файлы и данные",title:"Работа с файлами",time:"20 мин",desc:"Читаем и записываем файлы с помощью контекстного менеджера.",goals:["Использовать open()","Понимать режимы чтения и записи"],body:`<h2>Открытие файла</h2><p>Конструкция <code>with open(...)</code> автоматически закрывает файл после завершения блока. Для текста указывай кодировку UTF-8.</p><div class="codebox"><div class="code-top"><span>Файлы</span></div><textarea class="sample-code">with open("notes.txt", "w", encoding="utf-8") as file:\n    file.write("Мой конспект\\n")\n\nwith open("notes.txt", "r", encoding="utf-8") as file:\n    content = file.read()\n    print(content)</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Режимы: <code>r</code> — чтение, <code>w</code> — запись с перезаписью, <code>a</code> — добавление в конец. В браузерной среде файловая система виртуальная.</p>`,task:"Запиши строку в файл с помощью with open() и прочитай её обратно.",starter:'with open("test.txt", "w", encoding="utf-8") as file:\n    file.write("Привет")\n\nwith open("test.txt", "r", encoding="utf-8") as file:\n    print(file.read())',tests:[{label:"Используется with open()",test:c=>/with\s+open\s*\(/.test(c)},{label:"Есть запись write()",test:c=>/\.write\s*\(/.test(c)},{label:"Есть чтение read()",test:c=>/\.read\s*\(/.test(c)}]},
{module:"Файлы и данные",title:"JSON и CSV",time:"20 мин",desc:"Сохраняем структурированные данные в популярных форматах.",goals:["Работать с json","Понимать назначение CSV"],body:`<h2>JSON</h2><p>JSON — текстовый формат для хранения структурированных данных. Модуль <code>json</code> умеет преобразовывать словари и списки в JSON и обратно.</p><div class="codebox"><div class="code-top"><span>JSON</span></div><textarea class="sample-code">import json\n\nuser = {"name": "Аня", "age": 17}\ntext = json.dumps(user, ensure_ascii=False)\nprint(text)\nrestored = json.loads(text)\nprint(restored["name"])</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>CSV</h3><p>CSV хранит табличные данные строками, обычно разделёнными запятыми или точками с запятой. В Python есть стандартный модуль <code>csv</code>.</p>`,task:"Импортируй json, преобразуй словарь в JSON-строку через dumps() и выведи её.",starter:'import json\nuser = {"name": "Аня", "age": 17}\nprint(json.dumps(user, ensure_ascii=False))',tests:[{label:"Импортируется json",test:c=>/import\s+json/.test(c)},{label:"Используется dumps()",test:c=>/dumps\s*\(/.test(c)},{label:"Есть print()",test:c=>/print\s*\(/.test(c)}]},
{module:"ООП",title:"Классы и объекты",time:"25 мин",desc:"Моделируем сущности с помощью классов и экземпляров.",goals:["Создавать class","Понимать self и __init__"],body:`<h2>Класс — описание объекта</h2><p>Класс задаёт данные и поведение объектов. Метод <code>__init__</code> вызывается при создании экземпляра, а <code>self</code> ссылается на текущий объект.</p><div class="codebox"><div class="code-top"><span>Класс Dog</span></div><textarea class="sample-code">class Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        print(f"{self.name}: Гав!")\n\ndog = Dog("Бобик")\ndog.bark()</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Экземпляры одного класса могут иметь разные значения атрибутов. Методы описывают действия, доступные объекту.</p>`,task:"Создай класс Cat с __init__(self, name), сохрани имя в self.name и создай объект.",starter:'class Cat:\n    def __init__(self, name):\n        self.name = name\n\ncat = Cat("Мурка")\nprint(cat.name)',tests:[{label:"Есть class Cat",test:c=>/class\s+Cat\b/.test(c)},{label:"Есть __init__",test:c=>/def\s+__init__/.test(c)},{label:"Используется self.name",test:c=>/self\.name\s*=/.test(c)}]},
{module:"ООП",title:"Наследование и композиция",time:"20 мин",desc:"Повторно используем поведение и строим объекты из компонентов.",goals:["Понимать наследование","Переопределять методы"],body:`<h2>Наследование</h2><div class="codebox"><div class="code-top"><span>Базовый и дочерний класс</span></div><textarea class="sample-code">class Animal:\n    def speak(self):\n        return "Звук"\n\nclass Cat(Animal):\n    def speak(self):\n        return "Мяу"\n\ncat = Cat()\nprint(cat.speak())</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Наследование подходит для отношения «является». Композиция подходит, когда объект использует другие объекты как части. Не усложняй архитектуру без необходимости.</p>`,task:"Создай класс Dog, наследующий Animal, и переопредели метод speak().",starter:'class Animal:\n    def speak(self):\n        return "Звук"\n\nclass Dog(Animal):\n    def speak(self):\n        return "Гав"\n\nprint(Dog().speak())',tests:[{label:"Есть базовый класс Animal",test:c=>/class\s+Animal\b/.test(c)},{label:"Dog наследуется от Animal",test:c=>/class\s+Dog\s*\(\s*Animal\s*\)/.test(c)},{label:"Есть метод speak",test:c=>/def\s+speak\s*\(/.test(c)}]},
{module:"Продвинутый Python",title:"Итераторы и генераторы",time:"20 мин",desc:"Обрабатываем последовательности поэлементно и экономим память.",goals:["Понимать yield","Создавать генераторы"],body:`<h2>Генератор с yield</h2><p>Генератор выдаёт значения по мере необходимости, а не создаёт сразу всю последовательность в памяти.</p><div class="codebox"><div class="code-top"><span>Числа по запросу</span></div><textarea class="sample-code">def count_up_to(limit):\n    number = 1\n    while number <= limit:\n        yield number\n        number += 1\n\nfor value in count_up_to(4):\n    print(value)</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Итератор предоставляет следующий элемент. Генераторная функция использует <code>yield</code> и приостанавливает своё выполнение между значениями.</p>`,task:"Напиши генератор count_up_to(n), который выдаёт числа от 1 до n с помощью yield.",starter:'def count_up_to(n):\n    for i in range(1, n + 1):\n        yield i\n\nprint(list(count_up_to(5)))',tests:[{label:"Есть функция",test:c=>/def\s+count_up_to\s*\(/.test(c)},{label:"Используется yield",test:c=>/\byield\b/.test(c)},{label:"Есть диапазон",test:c=>/range\s*\(/.test(c)}]},
{module:"Продвинутый Python",title:"Декораторы и контекстные менеджеры",time:"20 мин",desc:"Расширяем функции и управляем ресурсами.",goals:["Понимать @decorator","Использовать with"],body:`<h2>Декоратор</h2><p>Декоратор принимает функцию и возвращает новую функцию с дополнительным поведением. Символ <code>@</code> применяет декоратор к функции.</p><div class="codebox"><div class="code-top"><span>Простой декоратор</span></div><textarea class="sample-code">def announce(func):\n    def wrapper():\n        print("Начало")\n        func()\n        print("Конец")\n    return wrapper\n\n@announce\ndef hello():\n    print("Привет!")\n\nhello()</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Контекстный менеджер управляет входом и выходом из блока <code>with</code>, например автоматически освобождает файл или соединение.</p>`,task:"Создай функцию-декоратор, которая выводит сообщение до вызова функции.",starter:'def announce(func):\n    def wrapper():\n        print("Старт")\n        func()\n    return wrapper\n\n@announce\ndef hello():\n    print("Привет")\n\nhello()',tests:[{label:"Есть декоратор announce",test:c=>/def\s+announce\s*\(/.test(c)},{label:"Есть вложенная wrapper",test:c=>/def\s+wrapper\s*\(/.test(c)},{label:"Используется @announce",test:c=>/@announce/.test(c)}]},
{module:"Продвинутый Python",title:"Аннотации типов и dataclass",time:"20 мин",desc:"Делаем код понятнее с помощью типов и классов данных.",goals:["Добавлять type hints","Использовать dataclass"],body:`<h2>Аннотации типов</h2><p>Аннотации показывают ожидаемые типы аргументов и результата. Сами по себе они не гарантируют автоматическую проверку типов во время выполнения.</p><div class="codebox"><div class="code-top"><span>Type hints</span></div><textarea class="sample-code">def average(a: float, b: float) -> float:\n    return (a + b) / 2\n\nprint(average(4, 8))</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>dataclass</h3><p>Декоратор <code>@dataclass</code> автоматически создаёт стандартные методы для класса, который в основном хранит данные.</p>`,task:"Напиши функцию add(a: int, b: int) -> int, которая возвращает сумму.",starter:'def add(a: int, b: int) -> int:\n    return a + b\n\nprint(add(2, 5))',tests:[{label:"Есть аннотации int",test:c=>/a:\s*int/.test(c)&&/b:\s*int/.test(c)},{label:"Тип результата указан",test:c=>/->\s*int/.test(c)},{label:"Есть return",test:c=>/\breturn\b/.test(c)}]},
{module:"Практика",title:"Алгоритмы: поиск и сортировка",time:"25 мин",desc:"Оцениваем сложность и изучаем базовые алгоритмические идеи.",goals:["Понимать линейный поиск","Знать разницу O(n) и O(log n)"],body:`<h2>Линейный поиск</h2><p>Линейный поиск проверяет элементы один за другим. В худшем случае он выполняет количество проверок, пропорциональное длине списка: <code>O(n)</code>.</p><div class="codebox"><div class="code-top"><span>Поиск значения</span></div><textarea class="sample-code">def find_index(items, target):\n    for index, item in enumerate(items):\n        if item == target:\n            return index\n    return -1\n\nprint(find_index([4, 8, 2, 9], 2))</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><h3>Сортировка</h3><p>В реальных задачах чаще используй встроенный <code>sorted(items)</code> или <code>items.sort()</code>. Бинарный поиск работает за <code>O(log n)</code>, но требует предварительно отсортированных данных.</p>`,task:"Напиши функцию find_index(items, target), которая возвращает индекс найденного элемента или -1.",starter:'def find_index(items, target):\n    for index, item in enumerate(items):\n        if item == target:\n            return index\n    return -1\n\nprint(find_index([4, 8, 2], 2))',tests:[{label:"Есть функция find_index",test:c=>/def\s+find_index\s*\(/.test(c)},{label:"Используется enumerate",test:c=>/enumerate\s*\(/.test(c)},{label:"Возвращается -1",test:c=>/return\s+-1/.test(c)}]},
{module:"Практика",title:"Тестирование кода",time:"20 мин",desc:"Проверяем ожидаемое поведение функций автоматическими тестами.",goals:["Писать assert","Понимать unit-тесты"],body:`<h2>Проверка через assert</h2><p>Инструкция <code>assert</code> проверяет условие. Если оно ложно, Python поднимает исключение <code>AssertionError</code>.</p><div class="codebox"><div class="code-top"><span>Тесты</span></div><textarea class="sample-code">def pair_sum(a, b):\n    return a + b\n\nassert pair_sum(2, 5) == 7\nassert pair_sum(-1, 1) == 0\nprint("Все тесты пройдены")</textarea><div class="run-row"><button class="primary run-code">▶ Запустить код</button></div><pre class="output">Нажми «Запустить код»</pre></div><p>Хорошие тесты проверяют обычные случаи, граничные значения и неожиданные входные данные. Для больших проектов применяют <code>unittest</code> или сторонний <code>pytest</code>.</p>`,task:"Напиши функцию multiply(a, b) и проверь assert, что multiply(3, 4) равно 12.",starter:'def multiply(a, b):\n    return a * b\n\nassert multiply(3, 4) == 12\nprint("Тест пройден")',tests:[{label:"Есть функция multiply",test:c=>/def\s+multiply\s*\(/.test(c)},{label:"Возвращается произведение",test:c=>/return\s+\w+\s*\*\s*\w+/.test(c)},{label:"Есть assert",test:c=>/\bassert\b/.test(c)}]},
{module:"Практика",title:"HTTP и работа с API",time:"25 мин",desc:"Как программы обмениваются данными через веб-API.",goals:["Понимать HTTP и JSON","Разобраться с запросами GET и POST"],body:`<h2>Что такое API?</h2><p>API — интерфейс, через который одна программа взаимодействует с другой. В вебе часто используют HTTP-запросы и ответы в формате JSON.</p><ul><li><code>GET</code> — получить данные.</li><li><code>POST</code> — отправить данные для обработки или создания.</li><li>Статусы <code>200</code>, <code>404</code>, <code>500</code> обозначают разные результаты запроса.</li></ul><div class="callout">Пример с requests обычно выполняют локально после установки пакета: <code>python -m pip install requests</code>. Встроенная среда этого курса не обещает доступ к сети.</div><pre class="output" style="color:#d6e5f4">import requests\nresponse = requests.get("https://example.com", timeout=10)\nprint(response.status_code)</pre><p>Проверяй статус ответа, обрабатывай сетевые ошибки и никогда не публикуй секретные API-ключи в открытом коде.</p>`,task:"Напиши пример, который импортирует json и преобразует словарь в строку JSON.",starter:'import json\ndata = {"ok": True, "count": 3}\nprint(json.dumps(data))',tests:[{label:"Импортируется json",test:c=>/import\s+json/.test(c)},{label:"Используется dumps()",test:c=>/dumps\s*\(/.test(c)}]},
{module:"Финал",title:"Итоговый проект: консольный трекер задач",time:"40 мин",desc:"Собери изученные навыки в небольшое приложение.",goals:["Применить функции и списки","Разбить проект на понятные части"],body:`<h2>Что нужно сделать</h2><p>Собери трекер задач в консоли. Приложение должно хранить список задач и поддерживать добавление, просмотр и отметку о выполнении.</p><h3>План реализации</h3><ol><li>Создай список <code>tasks</code>.</li><li>Напиши функцию <code>add_task(tasks, title)</code>.</li><li>Напиши функцию <code>show_tasks(tasks)</code>.</li><li>Храни каждую задачу в словаре с ключами <code>title</code> и <code>done</code>.</li><li>Добавь несколько задач и проверь вывод.</li></ol><div class="callout">В этом встроенном редакторе можно написать и запустить прототип. Для полноценного интерактивного приложения с циклом меню лучше сохранить код в файл и запускать в терминале Python.</div>`,task:"Реализуй add_task(tasks, title), которая добавляет словарь задачи с title и done=False. Добавь две задачи и выведи список.",starter:'def add_task(tasks, title):\n    tasks.append({"title": title, "done": False})\n\ntasks = []\nadd_task(tasks, "Выучить списки")\nadd_task(tasks, "Написать проект")\nprint(tasks)',tests:[{label:"Есть функция add_task",test:c=>/def\s+add_task\s*\(/.test(c)},{label:"Используется append()",test:c=>/\.append\s*\(/.test(c)},{label:"Есть поля title и done",test:c=>/["']title["']/.test(c)&&/["']done["']/.test(c)},{label:"Добавляются задачи",test:c=>(c.match(/add_task\s*\(/g)||[]).length>=3}]}
];

const state={current:-1,completed:new Set(JSON.parse(localStorage.getItem("pypath_done")||"[]")),searchOpen:false};
const view=document.getElementById("view"), nav=document.getElementById("lessonNav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("pypath_done",JSON.stringify([...state.completed]));updateProgress();renderNav()}
function updateProgress(){let n=state.completed.size,p=Math.round(n/lessons.length*100);document.getElementById("progressText").textContent=p+"%";document.getElementById("progressFill").style.width=p+"%";document.getElementById("progressDetail").textContent=`${n} из ${lessons.length} уроков завершено`}
function renderNav(filter=""){nav.innerHTML="";let last="";lessons.forEach((l,i)=>{if(filter&&!(`${l.title} ${l.module} ${l.desc}`.toLowerCase().includes(filter.toLowerCase())))return;if(l.module!==last){let label=document.createElement("div");label.className="section-label";label.textContent=l.module;nav.append(label);last=l.module}let b=document.createElement("button");b.className="nav-item"+(state.current===i?" active":"")+(state.completed.has(i)?" done":"");b.innerHTML=`<span class="num">${state.completed.has(i)?"✓":i+1}</span><span class="nav-title">${esc(l.title)}</span>`;b.onclick=()=>openLesson(i);nav.append(b)})}
function home(){state.current=-1;renderNav();document.getElementById("crumb").textContent="PyPath / Главная";view.innerHTML=`<section class="hero"><div class="eyebrow">Бесплатный интерактивный курс</div><h1>Освой Python.<br><span style="color:var(--green)">От нуля до проектов.</span></h1><p>Полноценная учебная программа: от первой команды print() до ООП, файлов, алгоритмов, API и итогового проекта. Учись в своём темпе и запускай примеры прямо в браузере.</p><div class="hero-stats"><div class="stat"><b>${lessons.length}</b><span>уроков</span></div><div class="stat"><b>8</b><span>разделов</span></div><div class="stat"><b>0 ₽</b><span>стоимость</span></div></div><div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap"><button class="primary" id="startCourse">Начать обучение →</button><button class="soft" id="allLessons">Посмотреть программу</button></div></section><div class="welcome-grid"><div class="feature"><div class="emoji">⌨️</div><b>Пиши код</b><p>Редактируй примеры и запускай Python прямо на странице.</p></div><div class="feature"><div class="emoji">🎯</div><b>Практикуйся</b><p>В каждом уроке есть задание и автоматические проверки кода.</p></div><div class="feature"><div class="emoji">📈</div><b>Отслеживай рост</b><p>Прогресс сохраняется в браузере на этом устройстве.</p></div></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 14px"><div><div class="eyebrow">Учебный маршрут</div><h2 style="margin:5px 0">Программа курса</h2></div><span class="small">Выбери любой урок</span></div><input class="search" id="homeSearch" placeholder="Найти тему: циклы, функции, файлы…"><div class="module-grid" id="moduleGrid"></div><p class="footer-note">Среда выполнения загружает Pyodide с CDN при первом запуске, поэтому для выполнения Python-кода нужен интернет. Материалы и прогресс находятся в этом файле и браузере.</p>`;document.getElementById("startCourse").onclick=()=>openLesson(0);document.getElementById("allLessons").onclick=()=>document.getElementById("homeSearch").focus();document.getElementById("homeSearch").oninput=e=>renderCards(e.target.value)}
function renderCards(filter=""){const grid=document.getElementById("moduleGrid");if(!grid)return;grid.innerHTML="";let filtered=lessons.map((l,i)=>({...l,i})).filter(l=>`${l.title} ${l.module} ${l.desc}`.toLowerCase().includes(filter.toLowerCase()));filtered.forEach(l=>{let b=document.createElement("button");b.className="module-card";b.innerHTML=`<div class="meta">${esc(l.module)} · ${esc(l.time)} ${state.completed.has(l.i)?"· ✓ Пройден":""}</div><h3>${l.i+1}. ${esc(l.title)}</h3><p>${esc(l.desc)}</p>`;b.onclick=()=>openLesson(l.i);grid.append(b)});if(!filtered.length)grid.innerHTML='<div class="empty">Ничего не найдено. Попробуй другое слово.</div>'}
function openLesson(i){state.current=i;const l=lessons[i];renderNav();document.getElementById("crumb").textContent=`PyPath / ${l.module} / ${l.title}`;view.innerHTML=`<div class="lesson-head"><div class="eyebrow">Урок ${i+1} из ${lessons.length} · ${esc(l.module)} · ${esc(l.time)}</div><h1>${esc(l.title)}</h1><p>${esc(l.desc)}</p></div><div class="layout"><div><article class="article">${l.body}<h3>После урока ты сможешь</h3><ul>${l.goals.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></article><section class="exercise"><span class="tag">ПРАКТИЧЕСКОЕ ЗАДАНИЕ</span><h2>Проверь себя</h2><p class="task">${esc(l.task)}</p><div class="codebox"><div class="code-top"><span>solution.py</span><button class="ghost" id="resetEditor">Вернуть пример</button></div><textarea id="challengeCode" spellcheck="false">${esc(l.starter)}</textarea><div class="run-row"><button class="primary" id="checkCode">▶ Проверить решение</button><button class="soft" id="runChallenge">Запустить</button><span class="small" id="runtimeStatus">Готов к запуску</span></div><pre class="output" id="challengeOutput">Результат выполнения появится здесь.</pre><div id="testResults"></div></div><div class="hint">Подсказка: сначала запусти код и прочитай результат. Затем сравни его с требованиями задания.</div></section><div class="lesson-footer"><button class="soft" id="prevLesson" ${i===0?"disabled":""}>← Предыдущий урок</button><button class="primary" id="completeLesson">${state.completed.has(i)?"✓ Урок завершён":"Отметить урок завершён"}</button><button class="soft" id="nextLesson" ${i===lessons.length-1?"disabled":""}>Следующий урок →</button></div></div><div class="right-col"><div class="side-card"><h3>📌 В этом уроке</h3><ul>${l.goals.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div><div class="side-card"><h3>🧭 Как учиться эффективнее</h3><p>Не просто копируй код. Измени значение, предскажи результат и запусти снова.</p><p>Если получил ошибку — прочитай последнюю строку сообщения и проверь отступы.</p></div><div class="side-card"><h3>Твой прогресс</h3><p>${state.completed.has(i)?"Этот урок уже отмечен как завершённый.":"Отметь урок после практики, чтобы сохранить прогресс."}</p><div class="track"><div class="fill" style="width:${state.completed.has(i)?100:0}%"></div></div></div></div></div>`;
document.getElementById("prevLesson").onclick=()=>openLesson(i-1);document.getElementById("nextLesson").onclick=()=>openLesson(i+1);document.getElementById("completeLesson").onclick=()=>{if(state.completed.has(i))state.completed.delete(i);else state.completed.add(i);save();openLesson(i)};document.getElementById("resetEditor").onclick=()=>{document.getElementById("challengeCode").value=l.starter;document.getElementById("challengeOutput").textContent="Пример восстановлен.";document.getElementById("testResults").innerHTML=""};document.getElementById("runChallenge").onclick=()=>runPython(document.getElementById("challengeCode").value,document.getElementById("challengeOutput"),document.getElementById("runtimeStatus"));document.getElementById("checkCode").onclick=()=>checkChallenge(l);
}
let pyodidePromise=null;
async function getPyodide(status){if(!pyodidePromise){status.textContent="Загрузка Python…";pyodidePromise=new Promise((resolve,reject)=>{if(window.loadPyodide){resolve(window.loadPyodide()) ;return}let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";s.onload=()=>resolve(window.loadPyodide());s.onerror=()=>reject(new Error("Не удалось загрузить Pyodide. Проверь интернет или открой файл позже."));document.head.append(s)}).then(p=>p).catch(e=>{pyodidePromise=null;throw e})}return pyodidePromise}
async function runPython(code,out,status,inputValue=""){out.classList.remove("error");out.textContent="Выполняю…";status.textContent="Запуск";try{let py=await getPyodide(status);py.setStdin({stdin:()=>inputValue});let captured="";py.setStdout({batched: s=>{captured+=s}});py.setStderr({batched:s=>{captured+=s}});await py.runPythonAsync(code);out.textContent=captured||"Код выполнен без вывода.";status.textContent="Выполнено";return {ok:true,output:captured}}catch(e){out.classList.add("error");out.textContent=String(e);status.textContent="Ошибка";return {ok:false,output:String(e)}}}
async function checkChallenge(l){const code=document.getElementById("challengeCode").value,out=document.getElementById("challengeOutput"),status=document.getElementById("runtimeStatus"),results=document.getElementById("testResults");results.innerHTML="";let run=await runPython(code,out,status);let passed=0;const box=document.createElement("div");box.style.margin="12px";l.tests.forEach(t=>{let ok=false;try{ok=t.test(code)}catch(e){}if(ok)passed++;let row=document.createElement("div");row.style.cssText="padding:8px 10px;margin:5px 0;border-radius:8px;background:"+(ok?"#123022":"#2b2022")+";color:"+(ok?"#8cf0bc":"#ffb3b7")+";font-size:13px";row.textContent=(ok?"✓ ":"○ ")+t.label;box.append(row)});let summary=document.createElement("div");summary.style.cssText="font-weight:800;margin:12px 0;color:"+(passed===l.tests.length&&run.ok?"var(--green)":"var(--yellow)");summary.textContent=`Проверки структуры: ${passed} из ${l.tests.length}. `+(run.ok?"Код выполняется.":"Исправь ошибку выполнения.");box.prepend(summary);results.append(box);if(passed===l.tests.length&&run.ok){state.completed.add(state.current);save();document.getElementById("completeLesson").textContent="✓ Урок завершён";}}
document.addEventListener("click",async e=>{let run=e.target.closest(".run-code");if(run){let box=run.closest(".codebox"),area=box.querySelector("textarea"),out=box.querySelector(".output"),status=box.querySelector(".small")||{textContent:""};let inp=box.querySelector(".stdin-input");await runPython(area.value,out,status,inp?inp.value:"")}let copy=e.target.closest(".copy-sample");if(copy){let area=copy.closest(".codebox").querySelector("textarea");try{await navigator.clipboard.writeText(area.value);copy.textContent="Скопировано ✓";setTimeout(()=>copy.textContent="Копировать",1200)}catch{area.select();document.execCommand("copy");copy.textContent="Скопировано ✓"}}});
document.querySelector("[data-home]").onclick=home;document.getElementById("continueBtn").onclick=()=>openLesson(Math.min(lessons.length-1,Math.max(0,state.current<0?state.completed.size:state.current+1)));document.getElementById("searchBtn").onclick=()=>{if(state.current<0){document.getElementById("homeSearch")?.focus();return}home();setTimeout(()=>document.getElementById("homeSearch")?.focus(),0)};document.getElementById("resetBtn").onclick=()=>{if(confirm("Точно сбросить весь сохранённый прогресс?")){state.completed.clear();save();home()}};document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");home();updateProgress();
</script>
</body>
</html>
